# Dependency updates arrive as pull requests, tested by CI before merging.
# Python packages are handled by .github/workflows/update-locks.yml instead:
# it re-resolves the locks as a whole, which keeps pyproject.toml's ranges
# (compatibility) separate from the pins (what ships).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    ignore:
      # Majors that are migrations, done by hand rather than as updates
      # that can't build: Vite and its React plugin move together (plugin
      # 6.x needs Vite 8); Tailwind 4 changes the config and PostCSS plugin.
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      # Node's types follow the Node version CI and the image run (22).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      # React and the libraries built on it move together, majors included:
      # a React major lands with its types and the libraries that support it.
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom",
                   "@xyflow/react", "@monaco-editor/react",
                   "lucide-react", "zustand", "echarts-for-react"]
      # Patterns, not "*": 0.x packages (@kanaries/graphic-walker,
      # monaco-editor) are excluded, because for them a minor bump is a
      # breaking change and gets its own PR.
      minor-and-patch:
        patterns: ["*"]
        exclude-patterns: ["@kanaries/graphic-walker", "monaco-editor"]
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /desktop
    schedule: { interval: monthly }
  - package-ecosystem: cargo
    directory: /desktop/src-tauri
    schedule: { interval: monthly }
    groups:
      cargo: { patterns: ["*"] }

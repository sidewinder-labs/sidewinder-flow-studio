# Tests on every push to main and every pull request: the backend and plugin
# test suites, and the frontend typecheck and build. The desktop installers are
# built separately (desktop.yml), on demand and for release tags.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend and plugins (Python 3.13)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Version files agree
        run: bash scripts/check_version.sh

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            plugins/sfs-plugin-curvefit/pyproject.toml

      - name: Install the backend and the curve-fitting plugin
        run: python -m pip install "./backend[dev,pushdown,fastread]" ./plugins/sfs-plugin-curvefit

      - name: Backend tests
        working-directory: backend
        run: python -m pytest -q

      - name: Curve-fitting plugin tests
        working-directory: plugins/sfs-plugin-curvefit
        run: python -m pytest -q

  frontend:
    name: Frontend (typecheck and build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Build
        working-directory: frontend
        run: npm run build

# Tests on every push to main and every pull request: the backend and plugin
# test suites, and the frontend typecheck and build. The desktop installers are
# built separately (desktop.yml), on demand and for release tags.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend and plugins (Python 3.13)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Version files agree
        run: bash scripts/check_version.sh

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: locks/requirements.lock

      # The versions the Docker images and the desktop app ship (locks/requirements.lock)
      - name: Install the backend and the bundled plugins
        run: python -m pip install -c locks/requirements.lock "./backend[dev,pushdown,fastread]" ./plugins/sfs-plugin-curvefit ./plugins/sfs-plugin-tm1 ./plugins/sfs-plugin-powerbi

      - name: Installed packages match the lock
        run: python scripts/check_lock.py

      # A dependency added to a pyproject.toml without re-locking fails here
      - name: The locks are up to date
        run: |
          pip install uv==0.13.7
          scripts/lock.sh
          git diff --exit-code locks/requirements.lock reports-app/requirements.lock ||
            { echo "Run scripts/lock.sh and commit the locks"; exit 1; }

      - name: Backend tests
        working-directory: backend
        run: python -m pytest -q

      - name: Plugin tests (curve fitting, TM1, Power BI)
        run: |
          for p in curvefit tm1 powerbi; do (cd plugins/sfs-plugin-$p && python -m pytest -q) || exit 1; done

  frontend:
    name: Frontend (typecheck and build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Plugin catalog Worker
        run: node catalog/worker/test.mjs
